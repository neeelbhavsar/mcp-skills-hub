name: Refresh AI Library data

# Runs daily to pull new Skills / MCP servers / repos and commit the JSON.
# Vercel (or any git-connected host) then redeploys automatically on the push.
on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC every day
  workflow_dispatch: {} # allow manual runs from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The pipeline was dependency-free until source inspection needed a real
      # JavaScript parser. Regex-matching for `child_process` would misfire on
      # comments and strings, and these are public claims about other people's
      # code, so accuracy is worth the install step.
      - name: Install dependencies
        run: npm ci

      - name: Fetch latest data
        id: data
        env:
          # Required for star counts and maintenance signals (GraphQL needs a
          # token); also lifts the GitHub Search API limit for the repo queries.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_STAMP: ${{ github.event.repository.updated_at }}
        run: node scripts/build-data.mjs

      # Committing is what triggers a deploy, so it is gated on whether the
      # catalog actually changed in a way a visitor would notice. Star drift and
      # registry reordering used to force a full ~2,000-page rebuild every single
      # day; see scripts/lib/signature.mjs. A weekly floor keeps star counts and
      # health scores from going stale behind unchanged content.
      - name: Commit changes
        if: steps.data.outputs.deploy == 'true'
        run: |
          git config user.name "ai-library-bot"
          git config user.email "actions@github.com"
          git add src/data/*.json
          if git diff --staged --quiet; then
            echo "Nothing staged — data identical."
          else
            git commit -m "chore(data): refresh $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Skipped
        if: steps.data.outputs.deploy != 'true'
        run: echo "No meaningful catalog change — skipping commit, so no rebuild."
