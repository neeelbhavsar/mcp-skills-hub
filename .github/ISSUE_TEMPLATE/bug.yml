name: Bug report
description: Something on the site is broken
labels: ["bug"]
body:
  - type: input
    id: url
    attributes:
      label: Page
      placeholder: https://mcp-skills-hub.vercel.app/...
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Chrome 140 on macOS / Safari on iPhone
